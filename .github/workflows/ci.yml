name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name resolvehq-integration-mongodb \
            --publish 27018:27018 \
            mongo:8.2 \
            mongod --replSet rs0 --port 27018 --bind_ip_all
          docker exec resolvehq-integration-mongodb mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec resolvehq-integration-mongodb mongosh --quiet --eval \
              'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not elect a writable primary" >&2
          exit 1
      - run: npm ci --include=optional
      - name: Diagnose Rollup optional dependency installation
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "npm omit: $(npm config get omit)"
          echo "npm optional: $(npm config get optional)"
          echo "npm include: $(npm config get include)"
          echo "npm_config_omit: ${npm_config_omit-<unset>}"
          echo "npm_config_optional: ${npm_config_optional-<unset>}"
          if npm ls @rollup/rollup-linux-x64-gnu --all; then
            echo "npm dependency tree: Linux Rollup package is installed"
          else
            echo "npm dependency tree: Linux Rollup package is missing"
          fi
          node <<'NODE'
          const { existsSync } = require('node:fs');
          const { resolve } = require('node:path');
          const packageName = '@rollup/rollup-linux-x64-gnu';
          const manifests = [
            resolve('node_modules', packageName, 'package.json'),
            resolve('client/node_modules', packageName, 'package.json'),
          ];
          const installedAt = manifests.find(existsSync);
          console.log(`Package installed: ${installedAt ?? 'no'}`);
          try {
            console.log(
              `Client resolution: ${require.resolve(packageName, {
                paths: [resolve('client')],
              })}`,
            );
          } catch (error) {
            console.log(`Client resolution: NOT RESOLVABLE (${error.message})`);
          }
          NODE
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Run tests, including MongoDB authentication integration
        run: npm test
        env:
          RESOLVEHQ_MONGODB_INTEGRATION: '1'
          RESOLVEHQ_MONGODB_INTEGRATION_URI: mongodb://127.0.0.1:27018/resolvehq-integration?replicaSet=rs0
